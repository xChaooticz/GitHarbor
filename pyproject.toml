[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "githarbor"
version = "0.8.0"
description = "Your self-hosted safe harbor for Git repositories."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "alembic>=1.20.1,<2",
  "fastapi>=0.162.2,<1",
  "httpx>=0.28.1,<1",
  "jinja2>=3.1.6,<4",
  "pydantic-settings>=2.16.2,<3",
  "python-multipart>=0.0.33,<1",
  "sqlalchemy>=2.1.8,<3",
  "uvicorn[standard]>=0.54.0,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.4.1,<3",
  "pytest>=9.2.0,<10",
  "pytest-asyncio>=1.4.1.post1,<2",
  "respx>=0.23.1,<1",
  "ruff>=0.17.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["githarbor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "external_integration: requires disposable Forgejo and Gitea instances",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
