[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "githarbor"
version = "0.7.2"
description = "Your self-hosted safe harbor for Git repositories."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "alembic>=1.19.1,<2",
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "jinja2>=3.1.6,<4",
  "pydantic-settings>=2.15.0,<3",
  "python-multipart>=0.0.32,<1",
  "sqlalchemy>=2.0.52,<3",
  "uvicorn[standard]>=0.52.4,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "respx>=0.23.1,<1",
  "ruff>=0.16.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["githarbor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "external_integration: requires disposable Forgejo and Gitea instances",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
