services:
  githarbor:
    image: ghcr.io/xchaooticz/githarbor:${GITHARBOR_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    container_name: githarbor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/githarbor.db
    ports:
      - "${GITHARBOR_BIND_ADDRESS:-0.0.0.0}:${GITHARBOR_PORT:-9005}:8000"
    volumes:
      - githarbor-data:/data
      # Uncomment together with EXTERNAL_SOURCES_FILE=/config/external-sources.toml in .env.
      # - ./external-sources.toml:/config/external-sources.toml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  githarbor-data:
