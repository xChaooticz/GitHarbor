<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}GitHarbor{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', path='/githarbor-logo.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='/githarbor-logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img class="brand-mark" src="{{ url_for('static', path='/githarbor-logo.png') }}" alt=""><span>GitHarbor</span></a>
    <nav><a href="/">Dashboard</a><a href="/repositories">Repositories</a>{% if admin_actions_available|default(false) %}<a href="/admin">Admin</a>{% endif %}<a href="/about">About</a><a class="nav-link--api" href="/docs">API</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <span>Your self-hosted safe harbor for Git repositories.</span>
    <a class="footer-github" href="https://github.com/xChaooticz/GitHarbor" target="_blank" rel="noreferrer" aria-label="GitHarbor on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.49c-2.01.44-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.2 1.87.86 2.33.65.07-.52.28-.86.51-1.06-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 4.73c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg>
      <span>Open source on GitHub</span>
    </a>
    <span class="footer-love">Made with <span aria-label="love">♥</span> by <a href="https://github.com/xChaooticz" target="_blank" rel="noreferrer">xChaooticz</a></span>
  </footer>
  {% if auto_refresh|default(false) %}
  <script>
    (() => {
      let wasRunning = {{ sync_running|tojson }};
      const refreshStatus = async () => {
        try {
          const response = await fetch("/api/status", {cache: "no-store"});
          if (!response.ok) return;
          const currentStatus = await response.json();
          const isRunning = Boolean(currentStatus.sync_running);
          if (isRunning || wasRunning) {
            window.location.reload();
            return;
          }
          wasRunning = isRunning;
        } catch {
          // Keep the existing page visible if a short network interruption occurs.
        }
      };
      window.setInterval(refreshStatus, 10000);
    })();
  </script>
  {% endif %}
</body>
</html>
