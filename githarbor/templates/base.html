<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}GitHarbor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">⚓</span><span>GitHarbor</span></a>
    <nav><a href="/">Dashboard</a><a href="/repositories">Repositories</a>{% if admin_actions_available|default(false) %}<a href="/admin">Admin</a>{% endif %}<a href="/docs">API</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Your self-hosted safe harbor for Git repositories.</footer>
  {% if auto_refresh|default(false) %}
  <script>
    (() => {
      let wasRunning = {{ sync_running|tojson }};
      const refreshStatus = async () => {
        try {
          const response = await fetch("/api/status", {cache: "no-store"});
          if (!response.ok) return;
          const currentStatus = await response.json();
          const isRunning = Boolean(currentStatus.sync_running);
          if (isRunning || wasRunning) {
            window.location.reload();
            return;
          }
          wasRunning = isRunning;
        } catch {
          // Keep the existing page visible if a short network interruption occurs.
        }
      };
      window.setInterval(refreshStatus, 10000);
    })();
  </script>
  {% endif %}
</body>
</html>
