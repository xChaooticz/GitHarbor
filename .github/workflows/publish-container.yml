name: Publish container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git tag or commit to build
        required: true
      version_tag:
        description: Container version tag, for example v0.5.0
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/xchaooticz/githarbor

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.release.tag_name }}
          persist-credentials: false

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.event.release.tag_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=GitHarbor
            org.opencontainers.image.description=Your self-hosted safe harbor for Git repositories.
            org.opencontainers.image.source=https://github.com/xChaooticz/GitHarbor
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.event.release.tag_name }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
