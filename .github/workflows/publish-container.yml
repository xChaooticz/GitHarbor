name: Publish container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git tag or commit to build
        required: true
      version_tag:
        description: Container version tag, for example v0.5.1
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/xchaooticz/githarbor

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.release.tag_name }}
          persist-credentials: false

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.event.release.tag_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=GitHarbor
            org.opencontainers.image.description=Your self-hosted safe harbor for Git repositories.
            org.opencontainers.image.source=https://github.com/xChaooticz/GitHarbor
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.event.release.tag_name }}
          annotations: |
            org.opencontainers.image.title=GitHarbor
            org.opencontainers.image.description=Your self-hosted safe harbor for Git repositories.
            org.opencontainers.image.source=https://github.com/xChaooticz/GitHarbor
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.event.release.tag_name }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
